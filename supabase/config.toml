# Supabase CLI config. Run `supabase link --project-ref <ref>` to connect to your project.
project_id = "wit-ai-search"

# The MCP server does its own (optional) auth via MCP_PATH_SECRET; ChatGPT cannot send a Supabase JWT.
[functions.mcp]
verify_jwt = false

# Called by pg_cron with the project's anon key.
[functions.embed]
verify_jwt = true
